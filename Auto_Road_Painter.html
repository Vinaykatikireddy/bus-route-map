<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auto Road Painter — automatic route painting between two points</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,body,#map { height:100%; margin:0; padding:0; }
    .controls {
      position:absolute; left:10px; top:10px; z-index:3000;
      background:rgba(255,255,255,0.96); padding:10px; border-radius:10px;
      box-shadow:0 6px 24px rgba(0,0,0,0.12); font-family:system-ui,Segoe UI,Roboto,Arial; font-size:13px; width:360px;
      max-height:calc(100% - 20px); overflow-y:auto;
    }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn { padding:6px 10px; border-radius:8px; cursor:pointer; border:1px solid #d0d6db; background:#f7f8fa; font:inherit; }
    .btn:hover:not(:disabled) { background:#eef1f4; }
    .btn.active { background:#2b8cff; color:white; border-color:#1a6ed8; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .btn.primary { background:#2e7d32; color:#fff; border-color:#256628; }
    .btn.primary:hover:not(:disabled) { background:#276b2a; }
    label { display:block; margin:8px 0 4px; }
    select, input[type="range"], input[type="color"] { width:100%; box-sizing:border-box; }
    .hint { color:#666; font-size:12px; display:block; }
    .status { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; margin-top:6px; flex-wrap:wrap; }
    .small { font-size:11px; color:#666; white-space:nowrap; }
    .snapinfo { font-size:11px; color:#456; margin-top:4px; min-height:14px; }
    .legend { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:8px; padding-top:8px; border-top:1px solid #eceff1; font-size:11px; color:#555; }
    .legend span { display:inline-flex; align-items:center; gap:4px; }
    .legend i { width:12px; height:4px; border-radius:2px; display:inline-block; }
    .pt-dot {
      width:24px; height:24px; border-radius:50%; box-sizing:border-box;
      display:flex; align-items:center; justify-content:center;
      font:bold 13px system-ui,Segoe UI,Roboto,Arial; color:#fff;
      border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,0.55);
    }
    .snap-tip {
      background:rgba(20,20,20,0.78); color:#fff; border:none; border-radius:4px;
      font-size:11px; padding:1px 6px; box-shadow:none;
    }
    .snap-tip:before { display:none; }
    .leaflet-container.crosshair { cursor:crosshair !important; touch-action:none; }
    #brushPreview { position:fixed; pointer-events:none; z-index:3500; border-radius:50%; transform:translate(-50%,-50%); display:none; box-shadow:0 0 0 1px rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="controls" id="controls">
    <div class="row" style="margin-bottom:6px;">
      <button id="setStartBtn" class="btn">Set Start</button>
      <button id="setEndBtn" class="btn">Set End</button>
      <button id="clearPtsBtn" class="btn">Clear Points</button>
    </div>
    <div class="row" style="margin-bottom:6px;">
      <button id="eraseBtn" class="btn">Eraser (E)</button>
      <button id="paintBtn" class="btn primary">Paint Route</button>
      <button id="undoBtn" class="btn">↶ Undo</button>
      <button id="exportBtn" class="btn">⬇️ Export</button>
      <button id="importBtn" class="btn">⬆️ Import</button>
      <button id="clearPaintedBtn" class="btn">Clear All Painted</button>
      <input type="file" id="importFile" accept=".geojson,.json" style="display:none;" />
    </div>

    <label>Base layer</label>
    <select id="baseSelect">
      <option value="google">Google Hybrid (mt)</option>
      <option value="osm">OpenStreetMap (light)</option>
    </select>

    <label>Route color</label>
    <input id="paintColor" type="color" value="#ff0000" />

    <label>Route thickness: <span id="weightLabel">4</span></label>
    <input id="paintWeight" type="range" min="2" max="12" value="4" />

    <label>Eraser radius (meters): <span id="eraserLabel">20</span></label>
    <input id="eraserSize" type="range" min="5" max="200" value="20" />

    <div class="status">
      <span class="hint" id="hint">Click the map to place a point, then press Set Start / Set End.</span>
      <span class="small" id="loadedCount">Segments: 0</span>
    </div>
    <div class="snapinfo" id="snapInfo"></div>

    <div class="legend" id="legend"></div>
  </div>

  <div id="brushPreview"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  const map = L.map('map', { preferCanvas: true }).setView([16.4196, 81.6596], 13);
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' });
  const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { subdomains:['mt0','mt1','mt2','mt3'], attribution:'Map data © Google' });
  googleHybrid.addTo(map);

  const BASE_COLORS = {
    motorway:'#e53935', trunk:'#8e24aa', primary:'#fb8c00',
    secondary:'#1e88e5', tertiary:'#43a047', residential:'#78909c', service:'#a1887f'
  };
  const DEFAULT_BASE_COLOR = '#888888';
  const baseColorFor = t => BASE_COLORS[t] || DEFAULT_BASE_COLOR;

  const canvasRenderer = L.canvas({ padding:0 });
  const roadsLayer = L.layerGroup().addTo(map);
  const paintedLayer = L.layerGroup().addTo(map);
  const previewLayer = L.layerGroup().addTo(map);

  const idToLayer = new Map();
  const paintedCache = new Map();
  const paintedLayerMap = new Map();
  const nodes = new Map();
  const adj = new Map();

  const HISTORY_LIMIT = 200;
  const history = [];
  const STORAGE_KEY = 'autoRoadPainter.v1';

  let pending = null, pendingMarker = null;
  let startPoint = null, endPoint = null;
  let route = null, routeInfo = null, previewLine = null;
  let paintColor = '#ff0000', paintWeight = 4;
  let eraseMode = false, eraseActive = false;
  let eraserSize = 20;
  let currentStroke = null, activePointerId = null, lastEraseTime = 0;
  let previewVisible = false, lastCursorLatlng = null;
  const paintThrottleMs = 25;

  let currentFetchController = null;
  const MIN_ZOOM = 11;
  function maxBboxSpan(zoom){
    if (zoom >= 13) return 0.15;
    if (zoom === 12) return 0.2;
    return 0.25;
  }
  const MAX_INDEXED_SEGMENTS = 15000;

  const loadedBoxes = [];

  function subtractRect(a, b){
    if (b.s >= a.n || b.n <= a.s || b.w >= a.e || b.e <= a.w) return [a];
    const out = [];
    if (b.s > a.s) out.push({ s:a.s, n:b.s, w:a.w, e:a.e });
    if (b.n < a.n) out.push({ s:b.n, n:a.n, w:a.w, e:a.e });
    if (b.w > a.w) out.push({ s:Math.max(a.s, b.s), n:Math.min(a.n, b.n), w:a.w, e:b.w });
    if (b.e < a.e) out.push({ s:Math.max(a.s, b.s), n:Math.min(a.n, b.n), w:b.e, e:a.e });
    return out;
  }

  function rectCovered(target, boxes){
    let pieces = [target];
    for (const b of boxes){
      if (!pieces.length) return true;
      const next = [];
      for (const p of pieces){
        if (b.s >= p.n || b.n <= p.s || b.w >= p.e || b.e <= p.w) { next.push(p); continue; }
        for (const r of subtractRect(p, b)) next.push(r);
      }
      pieces = next;
      if (pieces.length > 64) return false;
    }
    return pieces.length === 0;
  }

  const OVERPASS_ENDPOINTS = [
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter'
  ];
  const ENDPOINT_TIMEOUT_MS = 120000;
  const FETCH_ATTEMPTS = 2;

  async function overpassFetch(q, signal){
    let lastErr = null;
    for (let attempt = 0; attempt < FETCH_ATTEMPTS; attempt++){
      for (const url of OVERPASS_ENDPOINTS){
        if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
        const ctrl = new AbortController();
        const onAbort = () => ctrl.abort();
        if (signal) signal.addEventListener('abort', onAbort);
        const timer = setTimeout(() => ctrl.abort(), ENDPOINT_TIMEOUT_MS);
        try {
          const res = await fetch(url, { method:'POST', body:q, signal:ctrl.signal, headers:{'Content-Type':'text/plain'} });
          if (!res.ok) throw new Error('Overpass ' + res.status);
          const data = await res.json();
          if (!data || !Array.isArray(data.elements)) throw new Error('bad Overpass response');
          return data;
        } catch(err){
          if (signal && signal.aborted) throw err;
          lastErr = err;
        } finally {
          clearTimeout(timer);
          if (signal) signal.removeEventListener('abort', onAbort);
        }
      }
    }
    throw lastErr || new Error('no Overpass endpoint reachable');
  }

  const setStartBtn = document.getElementById('setStartBtn');
  const setEndBtn = document.getElementById('setEndBtn');
  const clearPtsBtn = document.getElementById('clearPtsBtn');
  const paintBtn = document.getElementById('paintBtn');
  const undoBtn = document.getElementById('undoBtn');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const clearPaintedBtn = document.getElementById('clearPaintedBtn');
  const importFile = document.getElementById('importFile');
  const baseSelect = document.getElementById('baseSelect');
  const hint = document.getElementById('hint');
  const loadedCount = document.getElementById('loadedCount');
  const snapInfo = document.getElementById('snapInfo');
  const weightLabel = document.getElementById('weightLabel');
  const legendEl = document.getElementById('legend');
  const eraseBtn = document.getElementById('eraseBtn');
  const eraserSizeInput = document.getElementById('eraserSize');
  const eraserLabel = document.getElementById('eraserLabel');
  const brushPreview = document.getElementById('brushPreview');
  const container = map.getContainer();

  legendEl.innerHTML = Object.entries(BASE_COLORS)
    .map(([k,v]) => `<span><i style="background:${v}"></i>${k}</span>`).join('');

  setStartBtn.onclick = setStart;
  setEndBtn.onclick = setEnd;
  clearPtsBtn.onclick = clearPoints;
  eraseBtn.onclick = toggleEraser;
  paintBtn.onclick = paintRoute;
  undoBtn.onclick = undo;
  exportBtn.onclick = downloadGeoJSON;
  importBtn.onclick = () => importFile.click();
  clearPaintedBtn.onclick = clearAllPaintings;

  importFile.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      importPaintedGeoJSON(JSON.parse(await file.text()));
    } catch(err) {
      alert('Invalid GeoJSON file.');
      console.error(err);
    }
    importFile.value = '';
  });

  document.getElementById('paintColor').addEventListener('input', e => {
    paintColor = e.target.value;
    stylePreview();
  });
  document.getElementById('paintWeight').addEventListener('input', e => {
    paintWeight = +e.target.value;
    weightLabel.textContent = paintWeight;
    stylePreview();
  });
  eraserSizeInput.addEventListener('input', e => {
    eraserSize = +e.target.value;
    eraserLabel.textContent = eraserSize;
    updateBrushPreview();
  });

  baseSelect.addEventListener('change', e=>{
    if (e.target.value === 'osm') { map.removeLayer(googleHybrid); osmLayer.addTo(map); }
    else { map.removeLayer(osmLayer); googleHybrid.addTo(map); }
  });

  const isTypingTarget = t => !!t && (t.isContentEditable || ['INPUT','SELECT','TEXTAREA'].includes(t.tagName));

  window.addEventListener('keydown', e=>{
    if (isTypingTarget(e.target)) return;
    const key = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && key === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (key === 'e') toggleEraser();
    else if (key === 'escape' && eraseMode) toggleEraser();
  });

  function fmt(m){
    if (m == null || !isFinite(m)) return '—';
    return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
  }

  function hav(aLat, aLng, bLat, bLng){
    const R = 6371000, toR = Math.PI / 180;
    const dLat = (bLat - aLat) * toR, dLng = (bLng - aLng) * toR;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * toR) * Math.cos(bLat * toR) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  function statusMsg(msg){ hint.textContent = msg; hint.style.color = '#666'; }
  function statusErr(msg){ hint.textContent = msg; hint.style.color = '#d9534f'; }

  function pointIcon(label, color){
    return L.divIcon({
      className: '',
      html: `<div class="pt-dot" style="background:${color}">${label}</div>`,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });
  }

  function addMarker(latlng, label, color, distM){
    const m = L.marker(latlng, { icon: pointIcon(label, color), keyboard: false, zIndexOffset: 1000 }).addTo(map);
    m.bindTooltip(`${label} · ${fmt(distM)}`, { permanent: true, direction: 'top', className: 'snap-tip', offset: [0, -15] });
    m.on('click', ev => L.DomEvent.stopPropagation(ev.originalEvent));
    return m;
  }

  function nodeKey(lat, lng){ return lat.toFixed(7) + ',' + lng.toFixed(7); }

  function getNode(lat, lng){
    const k = nodeKey(lat, lng);
    if (!nodes.has(k)) nodes.set(k, { lat, lng });
    return k;
  }

  function addEdge(p1, p2, segId, highway){
    const k1 = getNode(p1.lat, p1.lon), k2 = getNode(p2.lat, p2.lon);
    if (k1 === k2) return;
    const a = [p1.lat, p1.lon], b = [p2.lat, p2.lon];
    const dist = hav(p1.lat, p1.lon, p2.lat, p2.lon);
    if (!adj.has(k1)) adj.set(k1, []);
    if (!adj.has(k2)) adj.set(k2, []);
    adj.get(k1).push({ from:k1, to:k2, segId, dist, coords:[a, b], highway });
    adj.get(k2).push({ from:k2, to:k1, segId, dist, coords:[b, a], highway });
  }

  function snapToRoad(latlng){
    let bestKey = null, bestDist = Infinity, bestNode = null;
    for (const [k, n] of nodes) {
      const d = hav(latlng.lat, latlng.lng, n.lat, n.lng);
      if (d < bestDist) { bestDist = d; bestKey = k; bestNode = n; }
    }
    if (bestKey == null) return null;
    return { key: bestKey, latlng: L.latLng(bestNode.lat, bestNode.lng), distM: bestDist };
  }

  class MinHeap {
    constructor(){ this.a = []; }
    get size(){ return this.a.length; }
    push(item){
      const a = this.a;
      a.push(item);
      let i = a.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (a[p].f <= a[i].f) break;
        const t = a[p]; a[p] = a[i]; a[i] = t;
        i = p;
      }
    }
    pop(){
      const a = this.a;
      if (!a.length) return null;
      const top = a[0];
      const last = a.pop();
      if (a.length) {
        a[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1;
          let s = i;
          if (l < a.length && a[l].f < a[s].f) s = l;
          if (r < a.length && a[r].f < a[s].f) s = r;
          if (s === i) break;
          const t = a[s]; a[s] = a[i]; a[i] = t;
          i = s;
        }
      }
      return top;
    }
  }

  function findRoute(sKey, eKey){
    const sN = nodes.get(sKey), eN = nodes.get(eKey);
    if (!sN || !eN) return null;
    const g = new Map([[sKey, 0]]);
    const came = new Map();
    const closed = new Set();
    const heap = new MinHeap();
    heap.push({ k:sKey, f:hav(sN.lat, sN.lng, eN.lat, eN.lng) });
    while (heap.size) {
      const top = heap.pop();
      const k = top.k;
      if (closed.has(k)) continue;
      if (k === eKey) break;
      closed.add(k);
      const gk = g.get(k);
      const edges = adj.get(k);
      if (!edges) continue;
      for (const e of edges) {
        const ng = gk + e.dist;
        if (!g.has(e.to) || ng < g.get(e.to)) {
          g.set(e.to, ng);
          came.set(e.to, { from:k, edge:e });
          const n = nodes.get(e.to);
          heap.push({ k:e.to, f: ng + hav(n.lat, n.lng, eN.lat, eN.lng) });
        }
      }
    }
    if (sKey !== eKey && !came.has(eKey)) return null;
    const edges = [];
    let cur = eKey;
    while (cur !== sKey) {
      const c = came.get(cur);
      if (!c) return null;
      edges.push(c.edge);
      cur = c.from;
    }
    edges.reverse();
    let d = 0;
    for (const e of edges) d += e.dist;
    return { edges, distM: d };
  }

  function clearPreview(){
    previewLayer.clearLayers();
    previewLine = null;
  }

  function drawPreview(){
    clearPreview();
    if (!route) return;
    const coords = [];
    for (const e of route.edges) {
      coords.push([e.coords[0][0], e.coords[0][1]]);
      coords.push([e.coords[1][0], e.coords[1][1]]);
    }
    previewLine = L.polyline(coords, {
      color: paintColor, weight: paintWeight + 2, opacity: 0.95, interactive: false
    }).addTo(previewLayer);
  }

  function stylePreview(){
    if (previewLine) previewLine.setStyle({ color: paintColor, weight: paintWeight + 2 });
  }

  function metersPerPixelAt(latlng){
    const p = map.latLngToContainerPoint(latlng);
    return map.distance(latlng, map.containerPointToLatLng(L.point(p.x + 1, p.y)));
  }

  const eventLatLng = e => {
    const r = container.getBoundingClientRect();
    return map.containerPointToLatLng(L.point(e.clientX - r.left, e.clientY - r.top));
  };

  function distToSegM(lat, lng, a, b){
    const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 111320;
    const ax = a[1] * kx, ay = a[0] * ky;
    const bx = b[1] * kx, by = b[0] * ky;
    const px = lng * kx, py = lat * ky;
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(ax + t * dx - px, ay + t * dy - py);
  }

  function updateBrushPreview(){
    const show = eraseMode && previewVisible;
    brushPreview.style.display = show ? 'block' : 'none';
    if (!show) return;
    const anchor = lastCursorLatlng || map.getCenter();
    const px = Math.max(8, Math.round((2 * eraserSize) / metersPerPixelAt(anchor)));
    brushPreview.style.width = px + 'px';
    brushPreview.style.height = px + 'px';
    brushPreview.style.background = 'rgba(255,255,255,0.45)';
    brushPreview.style.border = '2px solid #222';
    brushPreview.style.opacity = 1;
  }

  function toggleEraser(){
    eraseMode = !eraseMode;
    eraseBtn.classList.toggle('active', eraseMode);
    container.classList.toggle('crosshair', eraseMode);
    map.doubleClickZoom[eraseMode ? 'disable' : 'enable']();
    previewVisible = eraseMode && container.matches(':hover');
    updateBrushPreview();
    updateHint();
  }

  function eraseAt(latlng){
    if (!currentStroke) return;
    for (const [id, st] of paintedCache){
      if (!st.painted || !st.coords || st.coords.length < 2) continue;
      let hit = false;
      for (let i = 0; i < st.coords.length - 1; i++){
        if (distToSegM(latlng.lat, latlng.lng, st.coords[i], st.coords[i + 1]) <= eraserSize) { hit = true; break; }
      }
      if (!hit) continue;
      const prev = captureState(id);
      const next = { painted:false, color:null, weight:2, coords:st.coords, highway:st.highway };
      applyState(id, next);
      if (!currentStroke.changes.has(id)) currentStroke.changes.set(id, { id, prev, next });
    }
  }

  function finishErase(){
    if (!eraseActive) return;
    const changes = currentStroke ? Array.from(currentStroke.changes.values()) : [];
    if (changes.length) pushHistory({ type:'erase', changes });
    eraseActive = false;
    activePointerId = null;
    currentStroke = null;
    lastEraseTime = 0;
    map.dragging.enable();
  }

  container.addEventListener('pointerdown', e => {
    if (!eraseMode || !e.isPrimary || eraseActive) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    try { container.setPointerCapture(e.pointerId); } catch(_){}
    map.dragging.disable();
    eraseActive = true;
    activePointerId = e.pointerId;
    currentStroke = { type:'erase', changes:new Map() };
    lastEraseTime = 0;
    eraseAt(eventLatLng(e));
  });

  container.addEventListener('pointermove', e => {
    lastCursorLatlng = eventLatLng(e);
    brushPreview.style.left = e.clientX + 'px';
    brushPreview.style.top = e.clientY + 'px';
    updateBrushPreview();
    if (!eraseActive || e.pointerId !== activePointerId) return;
    const now = Date.now();
    if (now - lastEraseTime < paintThrottleMs) return;
    lastEraseTime = now;
    eraseAt(eventLatLng(e));
  });

  container.addEventListener('pointerup', finishErase);
  container.addEventListener('pointercancel', finishErase);
  container.addEventListener('lostpointercapture', finishErase);

  container.addEventListener('pointerenter', e => {
    if (e.pointerType === 'mouse' && !eraseActive) { previewVisible = true; updateBrushPreview(); }
  });
  container.addEventListener('pointerleave', () => {
    if (!eraseActive) { previewVisible = false; updateBrushPreview(); }
  });
  container.addEventListener('contextmenu', e => { if (eraseMode && e.isTrusted) e.preventDefault(); });

  function recomputeRoute(){
    route = null;
    routeInfo = null;
    clearPreview();
    if (startPoint && endPoint) {
      if (startPoint.key === endPoint.key) {
        routeInfo = 'same';
      } else if (!nodes.has(startPoint.key) || !nodes.has(endPoint.key)) {
        routeInfo = 'outside';
      } else {
        const r = findRoute(startPoint.key, endPoint.key);
        if (r && r.edges.length) { route = r; routeInfo = 'ok'; drawPreview(); }
        else routeInfo = 'none';
      }
    }
    updateHint();
    syncButtons();
  }

  function placePending(s){
    if (!s) { statusErr('No roads loaded to snap to.'); return; }
    if (pendingMarker) { map.removeLayer(pendingMarker); pendingMarker = null; }
    pending = { key:s.key, latlng:s.latlng, distM:s.distM };
    pendingMarker = addMarker(pending.latlng, '?', '#ff9800', pending.distM);
    updateSnapInfo();
    updateHint();
    syncButtons();
  }

  function clearPending(){
    if (pendingMarker) { map.removeLayer(pendingMarker); pendingMarker = null; }
    pending = null;
  }

  function setStart(){
    if (!pending) return;
    if (startPoint && startPoint.marker) map.removeLayer(startPoint.marker);
    startPoint = { key:pending.key, latlng:pending.latlng, distM:pending.distM, marker:null };
    startPoint.marker = addMarker(startPoint.latlng, 'A', '#2e7d32', startPoint.distM);
    clearPending();
    updateSnapInfo();
    recomputeRoute();
  }

  function setEnd(){
    if (!pending) return;
    if (endPoint && endPoint.marker) map.removeLayer(endPoint.marker);
    endPoint = { key:pending.key, latlng:pending.latlng, distM:pending.distM, marker:null };
    endPoint.marker = addMarker(endPoint.latlng, 'B', '#c62828', endPoint.distM);
    clearPending();
    updateSnapInfo();
    recomputeRoute();
  }

  function clearPoints(){
    clearPending();
    if (startPoint && startPoint.marker) map.removeLayer(startPoint.marker);
    if (endPoint && endPoint.marker) map.removeLayer(endPoint.marker);
    startPoint = null;
    endPoint = null;
    updateSnapInfo();
    recomputeRoute();
  }

  function updateSnapInfo(){
    const parts = [];
    if (startPoint) parts.push(`A: ${fmt(startPoint.distM)}`);
    if (endPoint) parts.push(`B: ${fmt(endPoint.distM)}`);
    if (pending) parts.push(`?: ${fmt(pending.distM)}`);
    snapInfo.textContent = parts.length ? 'Snapped distance — ' + parts.join(' · ') : '';
  }

  function updateHint(){
    if (eraseMode) { statusMsg('Hold mouse over painted roads to erase. Esc or E exits. Ctrl/Cmd+Z undoes.'); return; }
    if (pending) {
      const btn = startPoint ? 'Set End' : 'Set Start';
      statusMsg(`Point snapped ${fmt(pending.distM)} — press ${btn}.`);
      return;
    }
    if (startPoint && endPoint) {
      if (routeInfo === 'same') { statusErr('Start and end snap to the same road point.'); return; }
      if (routeInfo === 'none') { statusErr('No route found between these points — adjust points or zoom in.'); return; }
      if (routeInfo === 'outside') { statusErr('Route points are outside the loaded roads — pan back over them or Clear Points.'); return; }
      if (route) { statusMsg(`Route: ${fmt(route.distM)} · ${route.edges.length} segments — press Paint Route.`); return; }
    }
    if (startPoint) { statusMsg('Start set — click the map to place the destination.'); return; }
    if (map.getZoom() < MIN_ZOOM) { statusErr('Zoom ≥11 to load roads.'); return; }
    if (!nodes.size) { statusMsg('Loading roads…'); return; }
    statusMsg('Click the map to place a point, then press Set Start / Set End. Ctrl/Cmd+Z undoes painting.');
  }

  function syncButtons(){
    setStartBtn.disabled = !pending;
    setEndBtn.disabled = !(pending && startPoint);
    clearPtsBtn.disabled = !(pending || startPoint || endPoint);
    paintBtn.disabled = !(startPoint && endPoint && route);
    undoBtn.disabled = history.length === 0;
  }

  map.on('click', e => {
    if (eraseMode || eraseActive) return;
    if (map.getZoom() < MIN_ZOOM) { statusErr('Zoom ≥11 to place points.'); return; }
    if (!nodes.size) { statusErr('Roads are still loading — try again in a moment.'); return; }
    placePending(snapToRoad(e.latlng));
  });

  function paintRoute(){
    if (!route) return;
    const changes = [];
    for (const e of route.edges) {
      const id = e.segId;
      const prev = captureState(id);
      const next = { painted:true, color:paintColor, weight:paintWeight, coords:e.coords.map(c => [c[0], c[1]]), highway:e.highway };
      if (prev.painted && prev.color === paintColor && prev.weight === paintWeight) continue;
      applyState(id, next);
      changes.push({ id, prev, next });
    }
    if (changes.length) pushHistory({ type:'paint', changes });
    const paintedCount = changes.length;
    clearPoints();
    if (paintedCount) statusMsg(`Painted ${paintedCount} segments along the route.`);
    else statusMsg('Route is already painted with this color and thickness.');
  }

  const latlngArr = layer => layer.getLatLngs().map(p => [p.lat, p.lng]);

  function createPersistentPaint(coordsLatLngs, color, weight, segmentId = null) {
    const paintPoly = L.polyline(coordsLatLngs, {
      color, weight, opacity: 0.95, renderer: canvasRenderer, interactive: false
    });
    paintPoly._rp_id = segmentId;
    paintedLayer.addLayer(paintPoly);
    if (segmentId) paintedLayerMap.set(segmentId, paintPoly);
    return paintPoly;
  }

  function removePersistentPaintForId(id) {
    const p = paintedLayerMap.get(id);
    if (p) { paintedLayer.removeLayer(p); paintedLayerMap.delete(id); }
  }

  function toLatLngs(coords){
    return (coords || []).map(c => Array.isArray(c) ? L.latLng(c[0], c[1]) : c);
  }

  function captureState(id){
    const base = idToLayer.get(id);
    const cached = paintedCache.get(id);
    const highway = base?.feature?.properties?.highway ?? cached?.highway ?? null;
    const coords = cached?.coords || (base ? latlngArr(base) : null);
    if (cached && cached.painted) return { painted:true, color:cached.color, weight:cached.weight, coords, highway };
    return { painted:false, color:null, weight:2, coords, highway };
  }

  function applyState(id, st){
    const base = idToLayer.get(id);
    const painted = !!(st && st.painted);
    if (painted) {
      const color = st.color || paintColor;
      const weight = st.weight || 3;
      const coords = st.coords || (base ? latlngArr(base) : null);
      const highway = st.highway ?? base?.feature?.properties?.highway ?? null;
      paintedCache.set(id, { painted:true, color, weight, coords, highway });
      if (base) {
        base.setStyle({ color, weight });
        base.feature = base.feature || {};
        base.feature.properties = { ...(base.feature.properties||{}), painted:true, color };
      }
      if (!paintedLayerMap.has(id) && coords) createPersistentPaint(toLatLngs(coords), color, weight, id);
    } else {
      paintedCache.delete(id);
      if (base) {
        const highway = base.feature?.properties?.highway || st?.highway || null;
        base.setStyle({ color: baseColorFor(highway), weight: 2 });
        base.feature = base.feature || {};
        base.feature.properties = { ...(base.feature.properties||{}), painted:false };
        delete base.feature.properties.color;
      }
      removePersistentPaintForId(id);
    }
  }

  const syntheticKey = s => JSON.stringify([s.coords, s.color, s.weight || 3]);

  function findSyntheticLayer(s){
    const want = syntheticKey(s);
    let found = null;
    paintedLayer.eachLayer(l => {
      if (found || l._rp_id) return;
      if (syntheticKey({ coords: latlngArr(l), color: l.options.color, weight: l.options.weight }) === want) found = l;
    });
    return found;
  }

  function applySynthetic(s, op){
    if (op === 'remove') {
      const l = findSyntheticLayer(s);
      if (l) paintedLayer.removeLayer(l);
    } else {
      if (!findSyntheticLayer(s)) createPersistentPaint(toLatLngs(s.coords), s.color, s.weight || 3, null);
    }
  }

  function applyChange(ch, direction){
    if (ch.id) {
      applyState(ch.id, direction === 'undo' ? ch.prev : ch.next);
    } else if (ch.synthetic) {
      const op = ch.op === 'add' ? 'add' : 'remove';
      applySynthetic(ch.synthetic, direction === 'undo' ? (op === 'add' ? 'remove' : 'add') : op);
    }
  }

  let fetchTimeout = null;
  function debounceFetch(){ if (fetchTimeout) clearTimeout(fetchTimeout); fetchTimeout = setTimeout(fetchRoads, 350); }

  async function fetchRoads() {
    if (map.getZoom() < MIN_ZOOM) {
      loadedCount.textContent = `Segments: ${idToLayer.size}`;
      updateHint();
      return;
    }
    const b = map.getBounds();
    let s = b.getSouth(), n = b.getNorth(), w = b.getWest(), e = b.getEast();
    const span = maxBboxSpan(map.getZoom());
    const cLat = (s + n) / 2, cLng = (w + e) / 2;
    let clamped = false;
    if (n - s > span) { s = cLat - span / 2; n = cLat + span / 2; clamped = true; }
    if (e - w > span) { w = cLng - span / 2; e = cLng + span / 2; clamped = true; }
    const queryBox = { s, w, n, e };
    if (rectCovered(queryBox, loadedBoxes)) { updateHint(); return; }
    if (currentFetchController) try { currentFetchController.abort(); } catch(e){}
    const controller = new AbortController();
    currentFetchController = controller;
    const signal = controller.signal;
    const q = `[out:json][timeout:90];
      (way["highway"~"^(motorway|trunk|primary|secondary|tertiary|residential)$"](${s},${w},${n},${e})(if:length()>50););
      out geom;`;

    try {
      const data = await overpassFetch(q, signal);
      let indexed = 0;
      OUTER: for (const w of data.elements.filter(x => x.type==='way' && x.geometry?.length>=2)){
        const highway = w.tags?.highway || null;
        for (let j=0;j<w.geometry.length-1;j++){
          if (indexed>=MAX_INDEXED_SEGMENTS) break OUTER;
          const p1=w.geometry[j], p2=w.geometry[j+1];
          if(p1.lat===p2.lat && p1.lon===p2.lon) continue;
          const sid=`${w.id}-${j}`;
          if (idToLayer.has(sid)) continue;
          const seg = L.polyline([[p1.lat,p1.lon],[p2.lat,p2.lon]],{ color:baseColorFor(highway), weight:2, interactive:false, renderer:canvasRenderer });
          seg._rp_id = sid;
          seg.feature = { properties:{ osm_id:w.id, painted:false, highway } };

          const cached = paintedCache.get(sid);
          if (cached && cached.painted) {
            seg.setStyle({ color:cached.color, weight:cached.weight });
            seg.feature.properties.painted = true;
            seg.feature.properties.color = cached.color;
            if (!paintedLayerMap.has(sid)) createPersistentPaint(seg.getLatLngs(), cached.color, cached.weight, sid);
          }
          roadsLayer.addLayer(seg);
          idToLayer.set(sid, seg);
          addEdge(p1, p2, sid, highway);
          indexed++;
        }
      }
      const notes = [
        indexed>=MAX_INDEXED_SEGMENTS ? 'trimmed' : '',
        clamped ? 'central area' : ''
      ].filter(Boolean).join(', ');
      loadedCount.textContent=`Segments: ${idToLayer.size}${notes?' ('+notes+')':''}`;
      if (indexed < MAX_INDEXED_SEGMENTS) {
        loadedBoxes.push(queryBox);
        if (loadedBoxes.length > 80) loadedBoxes.shift();
      }
      if (startPoint && endPoint && nodes.has(startPoint.key) && nodes.has(endPoint.key)) recomputeRoute();
      else updateHint();
    } catch(err) {
      if(err.name!=='AbortError') { console.error(err); statusErr(`Roads fetch failed (${err.message}) — retry or zoom in.`); }
    } finally { if (currentFetchController === controller) currentFetchController = null; }
  }

  map.on('moveend', debounceFetch);
  map.on('zoomend', updateHint);

  function syncHistoryButtons(){
    undoBtn.disabled = history.length === 0;
  }

  function pushHistory(action){
    if(!action||!action.changes||action.changes.length===0) return;
    history.push(action);
    if(history.length>HISTORY_LIMIT) history.shift();
    syncHistoryButtons();
    saveLocal();
  }

  function undo(){
    if(!history.length){ syncHistoryButtons(); return; }
    const action = history.pop();
    for(let i=action.changes.length-1;i>=0;i--) applyChange(action.changes[i], 'undo');
    syncHistoryButtons();
    saveLocal();
  }

  function clearAllPaintings(){
    const ids = Array.from(paintedCache.keys());
    const changes = ids.map(id => {
      const prev = captureState(id);
      return { id, prev, next: { painted:false, color:null, weight:2, highway: prev.highway, coords: prev.coords } };
    });
    paintedLayer.eachLayer(l => {
      if (l._rp_id) return;
      changes.push({ synthetic: { coords: latlngArr(l), color: l.options.color, weight: l.options.weight }, op:'remove' });
    });
    ids.forEach(id => applyState(id, { painted:false }));
    paintedLayer.clearLayers();
    paintedLayerMap.clear();
    paintedCache.clear();
    if (changes.length) {
      pushHistory({ type:'clear', changes });
      statusMsg(`Cleared ${changes.length} painted segments. Ctrl/Cmd+Z undoes.`);
    } else {
      statusMsg('Nothing is painted yet.');
    }
  }

  function exportPaintedGeoJSON(){
    const features=[];
    paintedLayer.eachLayer(layer => {
      const props = { color: layer.options.color, weight: layer.options.weight };
      if (layer._rp_id) props.id = layer._rp_id;
      features.push({
        type:'Feature',
        geometry:{ type:'LineString', coordinates: layer.getLatLngs().map(p => [p.lng, p.lat]) },
        properties: props
      });
    });
    return { type:'FeatureCollection', features };
  }

  function downloadGeoJSON(){
    const data=exportPaintedGeoJSON();
    const blob=new Blob([JSON.stringify(data,null,2)],{ type:'application/json' });
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='auto-painted-roads.geojson'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  function importPaintedGeoJSON(geojson) {
    if (!geojson || !Array.isArray(geojson.features)) { alert('Not a GeoJSON FeatureCollection.'); return; }
    const changes = [];
    for (const f of geojson.features) {
      if (f.geometry?.type !== 'LineString' || !f.geometry.coordinates?.length) continue;
      const latlngs = toLatLngs(f.geometry.coordinates.map(c => [c[1], c[0]]));
      const color = f.properties?.color || paintColor;
      const weight = f.properties?.weight || paintWeight;
      const id = f.properties?.id;
      if (id) {
        const prev = captureState(id);
        const next = { painted:true, color, weight, coords: latlngs.map(p => [p.lat, p.lng]), highway: prev.highway };
        applyState(id, next);
        changes.push({ id, prev, next });
      } else {
        const synthetic = { coords: latlngs.map(p => [p.lat, p.lng]), color, weight };
        applySynthetic(synthetic, 'add');
        changes.push({ synthetic, op:'add' });
      }
    }
    if (changes.length) pushHistory({ type:'import', changes });
    else alert('No LineString features found in file.');
  }

  function saveLocal(){
    try {
      const painted = Array.from(paintedCache.entries());
      const synthetic = [];
      paintedLayer.eachLayer(l => {
        if (l._rp_id) return;
        synthetic.push({ coords: latlngArr(l), color: l.options.color, weight: l.options.weight });
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ painted, synthetic }));
    } catch(e) { console.warn('Local save failed', e); }
  }

  function loadLocal(){
    let raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch(e) { return; }
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      for (const [id, p] of (data.painted || [])) {
        if (p && p.painted) paintedCache.set(id, { painted:true, color:p.color, weight:p.weight, coords:p.coords||null, highway:p.highway||null });
      }
      for (const s of (data.synthetic || [])) {
        if (s?.coords?.length) createPersistentPaint(toLatLngs(s.coords), s.color || '#ff0000', s.weight || 3, null);
      }
    } catch(e) { console.warn('Local load failed', e); }
  }

  loadLocal();
  fetchRoads();
  updateSnapInfo();
  updateHint();
  syncButtons();
  </script>
</body>
</html>
